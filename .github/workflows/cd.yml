name: CD-Build & Deploy Backend to EC2

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "models/**"
      - "docker/backend.dockerfile"
      - ".github/workflows/cd.yml"

jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fresh-rotten

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Multi-Architecture Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fresh-rotten:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fresh-rotten:${{ github.sha }}

      - name: Prepare SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' <<'EOF'
            set -eu

            IMAGE_NAME="prashanttech/fresh-rotten"

            echo "Pulling ARM64 image..."
            docker pull --platform linux/arm64 "${IMAGE_NAME}:latest"

            echo "Replacing backend container..."
            docker rm -f fruits-backend 2>/dev/null || true

            docker run -d \
              --platform linux/arm64 \
              --name fruits-backend \
              --restart=always \
              -p 8000:8000 \
              -e MODEL_PATH=/app/models/Fruit_classification_model.h5 \
              "${IMAGE_NAME}:latest"

            echo "Checking backend health..."
            healthy=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error \
                http://localhost:8000/health; then
                healthy=true
                break
              fi
              echo "Health check attempt ${attempt}/12 failed; waiting 5 seconds..."
              sleep 5
            done

            echo "Container status:"
            docker ps -a --filter name=fruits-backend

            if [ "$healthy" != "true" ]; then
              echo "Backend logs:"
              docker logs --tail 100 fruits-backend
              echo "Health check failed."
              exit 1
            fi

            echo "Deployment health check passed."
            docker image prune -f
          EOF
