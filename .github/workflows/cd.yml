name: CD-Build & Deploy Backend to EC2

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "models/**"
      - "docker/backend.dockerfile"
      - ".github/workflows/cd.yml"

jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fresh-rotten

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (ARM64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f docker/backend.dockerfile \
            --push .

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on EC2 (Pull + Restart Container)
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            IMAGE_NAME='${{ env.IMAGE_NAME }}'

            docker pull --platform linux/arm64 "${IMAGE_NAME}:latest"

            docker rm -f fruits-backend || true

            docker run -d \
              --platform linux/arm64 \
              --name fruits-backend \
              --restart=always \
              -p 8000:8000 \
              -e MODEL_PATH=/app/models/Fruit_classification_model.h5 \
              "${IMAGE_NAME}:latest"

            sleep 5

            docker ps --filter name=fruits-backend

            docker logs --tail 50 fruits-backend

            curl --fail --show-error \
              http://localhost:8000/health

            docker image prune -f
          EOF
